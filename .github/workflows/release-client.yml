name: Build and Release Suoha Panel & Client

on:
  push:
    branches:
      - main
    paths:
      - "panel/**"
      - "client/**"
      - "suoha.sh"
      - ".github/workflows/release-client.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Unit Tests (Panel & Client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run panel tests
        working-directory: panel
        run: go test -v ./...

      - name: Run client tests
        working-directory: client
        run: go test -v ./...

  build-panel:
    name: Build Panel (linux-${{ matrix.arch_label }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            arch_label: amd64
          - goarch: arm64
            arch_label: arm64
          - goarch: arm
            goarm: "7"
            arch_label: armv7
          - goarch: "386"
            arch_label: "386"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build suoha-panel binary
        working-directory: panel
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p ../dist
          OUTPUT="../dist/suoha-panel-linux-${{ matrix.arch_label }}"
          go build -trimpath -ldflags="-s -w" -o "$OUTPUT" .
          sha256sum "$OUTPUT" | awk '{print $1 "  " $2}' | sed 's|../dist/||' > "${OUTPUT}.sha256"

      - name: Upload panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: suoha-panel-linux-${{ matrix.arch_label }}
          path: dist/*

  build-client:
    name: Build Client (${{ matrix.goos }}-${{ matrix.arch_label }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            arch_label: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            arch_label: arm64
            ext: ""
          - goos: linux
            goarch: arm
            goarm: "7"
            arch_label: armv7
            ext: ""
          - goos: linux
            goarch: "386"
            arch_label: "386"
            ext: ""
          - goos: windows
            goarch: amd64
            arch_label: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            arch_label: arm64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            arch_label: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            arch_label: arm64
            ext: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build suoha-client binary
        working-directory: client
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p ../dist
          OUTPUT="../dist/suoha-client-${{ matrix.goos }}-${{ matrix.arch_label }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "$OUTPUT" .
          sha256sum "$OUTPUT" | awk '{print $1 "  " $2}' | sed 's|../dist/||' > "${OUTPUT}.sha256"

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: suoha-client-${{ matrix.goos }}-${{ matrix.arch_label }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [build-panel, build-client]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="latest"
          fi

          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" artifacts/* --repo "$REPO" --clobber
          else
            gh release create "$TAG_NAME" artifacts/* \
              --repo "$REPO" \
              --target "${{ github.sha }}" \
              --title "New-Suoha Web Panel & Preferred IP Client ($TAG_NAME)" \
              --notes "Multi-arch static binaries for suoha-panel (Linux Web Control Panel) and suoha-client (Cross-platform Preferred IP Speedtest Uploader)."
          fi
