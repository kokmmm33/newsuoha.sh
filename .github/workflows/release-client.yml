name: Build and Release Suoha Client

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/release-client.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.arch_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            arch_label: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            arch_label: arm64
            ext: ""
          - goos: linux
            goarch: arm
            goarm: "7"
            arch_label: armv7
            ext: ""
          - goos: linux
            goarch: "386"
            arch_label: "386"
            ext: ""
          - goos: windows
            goarch: amd64
            arch_label: amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            arch_label: arm64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            arch_label: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            arch_label: arm64
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run unit tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: client
        run: go test -v ./...

      - name: Build binary
        working-directory: client
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p ../dist
          OUTPUT="../dist/suoha-client-${{ matrix.goos }}-${{ matrix.arch_label }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "$OUTPUT" .
          sha256sum "$OUTPUT" | awk '{print $1 "  " $2}' | sed 's|../dist/||' > "${OUTPUT}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: suoha-client-${{ matrix.goos }}-${{ matrix.arch_label }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="latest"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" artifacts/* --clobber
          else
            gh release create "$TAG_NAME" artifacts/* \
              --title "Suoha Preferred IP Client ($TAG_NAME)" \
              --notes "Cross-platform background Cloudflare preferred IP speedtest & auto-upload client for New-Suoha."
          fi
